name: Test Suite

on:
  push:
    branches: [ master, develop ]
    paths:
      - '**'
      - '!docs/**'
      - '!doc/**'
      - '!**/*.md'
      # Documentation that a test reads is code (see doc/system/15-testing.md).
      - 'docs/plans/DFG_GOV_01/**'
      - 'docs/archive/TELEMETRY_INTEGRATION_STATUS.md'
  pull_request:
    branches: [ master, develop ]
    paths:
      - '**'
      - '!docs/**'
      - '!doc/**'
      - '!**/*.md'
      # Documentation that a test reads is code (see doc/system/15-testing.md).
      - 'docs/plans/DFG_GOV_01/**'
      - 'docs/archive/TELEMETRY_INTEGRATION_STATUS.md'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      SECRET_KEY: test-secret-key-for-ci
      VOYAGE_API_KEY: test-key
    
    steps:
    - uses: actions/checkout@v4
      with:
        # No later step needs the checkout token header. The private clones use the app token.
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    # The private forge-telemetry/forge_contract_core clones need credentials
    # GITHUB_TOKEN does not carry: it is scoped to this repository alone. The
    # org's GitHub App (bds-fleet-operator) mints a short-lived installation
    # token scoped to just these two repos, replacing the long-lived
    # FORGE_TELEMETRY_TOKEN PAT that used to sit in a secret here -- see
    # docs/KNOWN_ISSUES.md's "FORGE_TELEMETRY_TOKEN CI Secret Is Invalid"
    # entry for what that static PAT cost: it silently went stale and
    # blocked every PR's `test` check until someone noticed and rotated it
    # by hand. render-git-auth.sh already mints from this same App for
    # Render's build; this mirrors it for GitHub Actions.
    - name: Mint the app tokens for the private forge-* dependency clones
      id: app-token
      uses: ./.github/actions/private-deps-token
      with:
        mode: ${{ vars.FORGE_BUILD_AUTH_MODE }}
        owner: ${{ github.repository_owner }}
        legacy-client-id: ${{ vars.FORGE_PRIVATE_DEPS_APP_CLIENT_ID }}
        legacy-private-key: ${{ secrets.FORGE_PRIVATE_DEPS_APP_PRIVATE_KEY }}
        telemetry-client-id: ${{ vars.FORGE_TELEMETRY_APP_CLIENT_ID }}
        telemetry-private-key: ${{ secrets.FORGE_TELEMETRY_APP_PRIVATE_KEY }}
        contract-core-client-id: ${{ vars.FORGE_CONTRACT_CORE_APP_CLIENT_ID }}
        contract-core-private-key: ${{ secrets.FORGE_CONTRACT_CORE_APP_PRIVATE_KEY }}

    # A green `pip install` does NOT prove this credential works -- pip's own
    # cache can serve a previously-built wheel without ever cloning again, so
    # a broken credential rides along invisibly until the cache key changes.
    # This probe is cache-independent and fails loudly. Run it OUTSIDE the
    # checkout: actions/checkout writes a GITHUB_TOKEN credential header into
    # the checked-out repo's local git config, which overrides a credential
    # supplied in a URL -- a probe run inside the workspace would silently
    # authenticate as GITHUB_TOKEN (which cannot read a private sibling repo)
    # and misreport a good app token as broken (confirmed directly in
    # Forge-Agents' own CI: `ls-remote` inside the checkout fails while the
    # same token from outside it succeeds).
    - name: Verify the minted token can actually clone
      env:
        BUILD_AUTH_MODE: ${{ steps.app-token.outputs.mode }}
        FORGE_DEPS_TOKEN: ${{ steps.app-token.outputs.legacy-token }}
        TELEMETRY_TOKEN: ${{ steps.app-token.outputs.telemetry-token }}
        CONTRACT_CORE_TOKEN: ${{ steps.app-token.outputs.contract-core-token }}
      run: |
        set -u
        probe() { # probe TOKEN REPOSITORY: exit status of ls-remote with that token
          (cd "${RUNNER_TEMP:-/tmp}" && git ls-remote "https://x-access-token:${1}@github.com/Boswell-Digital-Solutions/${2}.git" >/dev/null 2>&1)
        }
        if [ "$BUILD_AUTH_MODE" = "split" ]; then
          # Each token must reach its own repository and must not reach the other one.
          probe "$TELEMETRY_TOKEN" forge-telemetry \
            || { echo "::error::The telemetry build App token cannot read forge-telemetry."; exit 1; }
          probe "$CONTRACT_CORE_TOKEN" forge_contract_core \
            || { echo "::error::The contract-core build App token cannot read forge_contract_core."; exit 1; }
          if probe "$TELEMETRY_TOKEN" forge_contract_core; then
            echo "::error::The telemetry build App token can read forge_contract_core. Restrict its installation."; exit 1
          fi
          if probe "$CONTRACT_CORE_TOKEN" forge-telemetry; then
            echo "::error::The contract-core build App token can read forge-telemetry. Restrict its installation."; exit 1
          fi
          echo "split mode: each token reaches its own repository only"
        else
          set +e
          OUT=$(cd "${RUNNER_TEMP:-/tmp}" && git ls-remote \
            "https://x-access-token:${FORGE_DEPS_TOKEN}@github.com/Boswell-Digital-Solutions/forge-telemetry.git" 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "git exit ${STATUS}:"
            printf '%s\n' "$OUT"
            echo "::error::The minted app token cannot read forge-telemetry. Check that bds-fleet-operator still has contents:read on that repository, and that FORGE_PRIVATE_DEPS_APP_CLIENT_ID/FORGE_PRIVATE_DEPS_APP_PRIVATE_KEY are set on this repo."
            exit 1
          fi
          echo "forge-telemetry reachable with the minted app token"
        fi

    - name: Install dependencies
      env:
        BUILD_AUTH_MODE: ${{ steps.app-token.outputs.mode }}
        FORGE_DEPS_TOKEN: ${{ steps.app-token.outputs.legacy-token }}
        TELEMETRY_TOKEN: ${{ steps.app-token.outputs.telemetry-token }}
        CONTRACT_CORE_TOKEN: ${{ steps.app-token.outputs.contract-core-token }}
      run: |
        python -m pip install --upgrade pip
        org_url="https://github.com/Boswell-Digital-Solutions"
        if [ "$BUILD_AUTH_MODE" = "split" ]; then
          # Path-scoped: each token rewrites only its own repository URL.
          git config --global "url.https://x-access-token:${TELEMETRY_TOKEN}@github.com/Boswell-Digital-Solutions/forge-telemetry.git.insteadOf" "${org_url}/forge-telemetry.git"
          git config --global "url.https://x-access-token:${CONTRACT_CORE_TOKEN}@github.com/Boswell-Digital-Solutions/forge_contract_core.git.insteadOf" "${org_url}/forge_contract_core.git"
        else
          git config --global "url.https://x-access-token:${FORGE_DEPS_TOKEN}@github.com/.insteadOf" "https://github.com/"
        fi
        python -m pip install -r requirements.txt
        python -m pip install pytest pytest-asyncio pytest-cov bandit safety mypy
        if [ "$BUILD_AUTH_MODE" = "split" ]; then
          git config --global --unset "url.https://x-access-token:${TELEMETRY_TOKEN}@github.com/Boswell-Digital-Solutions/forge-telemetry.git.insteadOf" || true
          git config --global --unset "url.https://x-access-token:${CONTRACT_CORE_TOKEN}@github.com/Boswell-Digital-Solutions/forge_contract_core.git.insteadOf" || true
        else
          git config --global --unset "url.https://x-access-token:${FORGE_DEPS_TOKEN}@github.com/.insteadOf" || true
        fi

    # Throwaway-cluster proof for the runtime-promotion schema repair (alembic 20261005_01).
    # It builds the drifted state, runs the repair, and checks refusals. It never reads a configured database.
    - name: Prove the runtime-promotion schema repair on a throwaway Postgres cluster
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends postgresql postgresql-common
        DATAFORGE_TEST_PYTHON="$(command -v python)" pg_virtualenv bash scripts/prove_runtime_promotion_schema_repair_postgres.sh

    - name: Run mypy type checking
      run: |
        mypy app/utils/redis_utils.py \
              app/utils/metrics.py \
              app/api/diligence_crud.py \
              app/utils/embeddings.py \
              --ignore-missing-imports || true
      continue-on-error: true
    
    # Install steps keep their network egress. Only the pytest step below runs isolated.
    # The runner needs bubblewrap, and it never pulls an image (finding M1). The image is
    # pulled here, in a separate and declared step, by the digest that tests/isolation/services.py pins.
    - name: Install the isolated runner prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bubblewrap iproute2
        docker pull pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        docker tag pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b pgvector/pgvector:pg16

    # CI provider option A, with a probe (design section 4.1). Ubuntu 24.04 runners set
    # kernel.apparmor_restrict_unprivileged_userns=1, which blocks unprivileged user namespaces.
    # This step changes that setting on the ephemeral runner VM only. The tests still run as the
    # unprivileged runner user inside the sandbox. The sudo route for running tests stays refused.
    # The runner still probes, and it exits 86 if the namespaces stay blocked.
    # Remove this step if the job ever moves to a self-hosted runner: the setting would persist there.
    # A key that is absent does not fail the step. The values are printed before and after.
    - name: Allow unprivileged user namespaces on the runner VM
      run: |
        for key in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces; do
          echo "before: $key = $(sysctl -n "$key" 2>/dev/null || echo absent)"
        done
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "key absent or not writable"
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || echo "key absent or not writable"
        for key in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces; do
          echo "after: $key = $(sysctl -n "$key" 2>/dev/null || echo absent)"
        done

    # The runner exits 86 if it cannot isolate, 87 on a violation or an undeclared skip, 88 on a
    # teardown fault. It never runs the suite without isolation.
    - name: Run pytest with coverage (isolated runner)
      run: |
        scripts/run-tests-isolated.sh --database postgres --migrate --report isolation-report.json -- \
          tests/ -v --cov=app --cov-report=xml --cov-report=term-missing -x
    
    # Advisory only (decision owner, 2026-10-05): a coverage-upload fault must not fail the job.
    # The upload is still attempted, and its failure stays visible in the log. The runner step
    # (sandbox proofs, migrations, tests and the skip policy) stays blocking. This change touches no other step.
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      continue-on-error: true
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Run security checks
      run: |
        bandit -r app/ -f json -o bandit-report.json || true
        safety check --json || true
      continue-on-error: true
    
    - name: Comment test results on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            fs.accessSync('./coverage.xml', fs.constants.R_OK);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Tests passed! Coverage reports available.'
            });
          } catch (e) {
            console.log('Could not post comment:', e);
          }

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 black isort
    
    - name: Check code format with black
      run: black --check app/ || true
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: isort --check-only app/ || true
      continue-on-error: true
    
    - name: Lint with flake8
      run: flake8 app/ --max-line-length=120 --ignore=E203,W503 || true
      continue-on-error: true
