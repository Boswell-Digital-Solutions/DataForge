name: Security Scanning

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC

jobs:
  # Standing rule (2026-10-01): a documentation-only change runs no code scan.
  # The secret scan (`secrets`) has no condition and runs on every change, because a
  # documentation file can hold a leaked secret. A workflow-level `paths` filter would stop it,
  # so this job decides the scope instead. The scan jobs are fail-closed: each runs unless this
  # job says `code=false`. A failed scope job leaves the output empty, so the scans run.
  # Do not test `== 'true'`. `tests/test_ci_change_scope.py` covers the script.
  scope:
    runs-on: ubuntu-latest
    name: Detect change scope
    outputs:
      code: ${{ steps.scope.outputs.code }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - id: scope
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        files=""
        if [ "$EVENT" = "pull_request" ]; then
          files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
        elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
          files="$(git diff --name-only "$BEFORE" "$SHA")"
        fi
        # An unknown scope (an empty list, or the weekly schedule) runs the scans.
        printf '%s\n' "$files" | bash scripts/ci-change-scope.sh | tee -a "$GITHUB_OUTPUT"

  bandit:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    name: Bandit Security Scan
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit security scan
      run: |
        bandit -r app/ -ll -f json -o bandit-report.json || true
        bandit -r app/ -ll
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  safety:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json > safety-report.json || true
        safety check
      continue-on-error: true

    - name: Upload Safety report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: safety-report
        path: safety-report.json

  dependency-check:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    name: OWASP Dependency Check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      # Informational scan (matches the Bandit/Safety jobs): a tooling failure
      # or transient NVD issue should not block the PR. The action also requires
      # a non-empty project name or it exits with "Missing argument for option: project".
      continue-on-error: true
      with:
        project: 'DataForge'
        path: '.'
        format: 'JSON'

    - name: Upload Dependency Check report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: reports/
        if-no-files-found: ignore

  codeql:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  secrets:
    runs-on: ubuntu-latest
    name: Secret Detection
    
    steps:
    - uses: actions/checkout@v4
    
    - name: TruffleHog Secret Scanning
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --json --fail
      continue-on-error: true
